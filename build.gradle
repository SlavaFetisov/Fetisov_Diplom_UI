plugins {
    id 'java-library'
    id 'io.qameta.allure' version '2.12.0'
    id 'io.freefair.lombok' version "9.2.0"
}

repositories {
    mavenCentral()
}

def restAssuredVersion = "6.0.0",
    allureVersion = "2.32.0",
    selenideVersion = '7.15.0',
    junitVersion = '5.14.2',
    slf4jVersion = "2.0.17"

allure {
    report {
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

dependencies {
    testImplementation(
            "io.rest-assured:rest-assured:$restAssuredVersion",
            "io.rest-assured:json-schema-validator:$restAssuredVersion",
            "io.qameta.allure:allure-rest-assured:$allureVersion",
            "tools.jackson.core:jackson-databind:3.1.0",
            "net.datafaker:datafaker:2.5.4",
            "com.codeborne:selenide:$selenideVersion",
            "io.qameta.allure:allure-selenide:$allureVersion",
            'org.aspectj:aspectjweaver:1.9.22',
            'org.junit-pioneer:junit-pioneer:2.3.0',
            "org.assertj:assertj-core:3.27.7",
            "org.junit.jupiter:junit-jupiter:5.14.3",
            'org.aeonbits.owner:owner:1.0.12',
            "org.slf4j:slf4j-simple:$slf4jVersion"
    )
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperties(System.getProperties())

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}
task filter_test(type: Test) {
    useJUnitPlatform {
        includeTags("filter")
    }
}
task basket_test(type: Test) {
    useJUnitPlatform {
        includeTags("basket")
    }
}
task search_test(type: Test) {
    useJUnitPlatform {
        includeTags("search")
    }
}

task main_page_test(type: Test) {
    useJUnitPlatform {
        includeTags("main_page")
    }
}
